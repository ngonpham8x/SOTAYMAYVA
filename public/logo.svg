<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / Icon Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#blueGrad)" filter="url(#shadow)" />
  
  <!-- Outer Gold Accent Stitching Circle -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#FDE68A" stroke-width="4" stroke-dasharray="10 8" opacity="0.6" />

  <!-- Tailor Measuring Tape Arc -->
  <path d="M 120 370 A 180 180 0 0 1 392 370" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
  
  <!-- Golden Tailoring Scissors Left Blade & Loop -->
  <g fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left loop -->
    <ellipse cx="185" cy="340" rx="36" ry="46" transform="rotate(-30 185 340)" stroke="url(#goldGrad)" stroke-width="16" />
    <!-- Right loop -->
    <ellipse cx="327" cy="340" rx="36" ry="46" transform="rotate(30 327 340)" stroke="url(#goldGrad)" stroke-width="16" />
    
    <!-- Left Scissor Blade -->
    <path d="M 205 310 L 330 150" stroke="#F8FAFC" stroke-width="20" />
    <!-- Right Scissor Blade -->
    <path d="M 307 310 L 182 150" stroke="#F8FAFC" stroke-width="20" />
  </g>

  <!-- Center Pivot Bolt of Scissors -->
  <circle cx="256" cy="235" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="4" />

  <!-- Sewing Needle & Golden Thread -->
  <path d="M 256 100 L 256 220" stroke="#FDE68A" stroke-width="8" stroke-linecap="round" />
  <!-- Needle Eye -->
  <ellipse cx="256" cy="115" rx="3" ry="8" fill="#1E40AF" />
  <!-- Curved Thread -->
  <path d="M 256 115 C 290 80, 350 110, 370 160 C 390 210, 360 260, 310 270" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 4" />

  <!-- Sparkle stars -->
  <path d="M 370 120 L 375 135 L 390 140 L 375 145 L 370 160 L 365 145 L 350 140 L 365 135 Z" fill="#FDE68A" />
  <path d="M 140 180 L 143 190 L 153 193 L 143 196 L 140 206 L 137 196 L 127 193 L 137 190 Z" fill="#FDE68A" />
</svg>
